# ZPlus Manpower on Docker, made for Coolify ("Docker Compose" build pack).
# Coolify builds the app from this repo, routes the domain through its proxy and issues the HTTPS certificate.
# Set these in Coolify -> Environment Variables: APP_KEY (required), APP_URL; database passwords are generated by Coolify.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: "ZPlus Manpower"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-https://zplus.epf-dashboard.online}
      APP_TIMEZONE: Asia/Kolkata
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: zplus
      DB_USERNAME: zplus
      DB_PASSWORD: ${SERVICE_PASSWORD_ZPLUSDB}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
    expose:
      - "80"
    volumes:
      - zplus-storage:/var/www/html/storage/app     # signed scans, documents, logos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zplus
      MYSQL_USER: zplus
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_ZPLUSDB}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_ZPLUSROOT}
    # log-bin-trust-function-creators lets the app's database user create the agency-isolation triggers
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
    volumes:
      - zplus-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  zplus-storage:
  zplus-mysql:
