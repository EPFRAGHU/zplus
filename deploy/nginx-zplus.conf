# /etc/nginx/sites-available/zplus
# Replace billing.example.com with your subdomain, then:
#   sudo ln -s /etc/nginx/sites-available/zplus /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d billing.example.com      (adds HTTPS)
server {
    listen 80;
    server_name billing.example.com;
    root /var/www/zplus/public;
    index index.php;

    client_max_body_size 12M;   # signed attendance scans up to 10 MB

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
